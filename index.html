<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Demo</title>

  <style>
    :root{
      --bgTop:#b9d7f2;
      --bgBot:#cfe9df;

      --text:#0b0f14;
      --softShadow: 0 14px 30px rgba(0,0,0,.10);

      --nav:#0c0d10;
      --navIcon: rgba(255,255,255,.75);
      --navIconActive: rgba(255,255,255,.95);

      --marqueeBg: rgba(155, 220, 138, .88);
    }

    /* ===== Diia font: e-Ukraine (place files in ./fonts/) ===== */
    @font-face{
      font-family:"e-Ukraine";
      src:url("./fonts/e-Ukraine-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"e-Ukraine";
      src:url("./fonts/e-Ukraine-Medium.woff2") format("woff2");
      font-weight:500;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"e-Ukraine";
      src:url("./fonts/e-Ukraine-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"e-Ukraine Head";
      src:url("./fonts/e-UkraineHead-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"e-Ukraine Head";
      src:url("./fonts/e-UkraineHead-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: linear-gradient(180deg, var(--bgTop), var(--bgBot));
      font-family:"e-Ukraine", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow:hidden;
    }

    .app{ height:100%; width:100%; position:relative; }
    .view{
      position:absolute; inset:0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      transition: opacity .22s ease, transform .22s ease;
    }
    .view.hidden{ opacity:0; transform: translateY(10px); pointer-events:none; }

    /* ===== bottom nav (НЕ показывать на PIN) ===== */
    .bottomNav{
      position:fixed;
      left:0; right:0; bottom:0;
      padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px);
      background: var(--nav);
      z-index:50;
      display:block;
    }
    body.locked .bottomNav{ display:none; }

    .navRow{
      width:min(430px, 100%);
      margin:0 auto;
      display:flex; justify-content:space-around; align-items:flex-end;
      gap:10px;
    }
    .navItem{
      width:24%;
      display:flex; flex-direction:column; align-items:center;
      gap:6px;
      color: var(--navIcon);
      font-size:14px; font-weight:700; letter-spacing:-0.1px;
      text-decoration:none;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .navItem svg{ width:26px; height:26px; stroke: var(--navIcon); fill:none; stroke-width:2.2; }
    .navItem.active{ color: var(--navIconActive); }
    .navItem.active svg{ stroke: var(--navIconActive); }

    /* ===== common page scroll ===== */
    .page{ height:100%; overflow:hidden; }
    .scroll{
      height:100%;
      overflow:auto;
      padding: 16px 16px 96px;
      scrollbar-width: thin;
    }
    .scroll::-webkit-scrollbar{ width:6px; }
    .scroll::-webkit-scrollbar-thumb{ background: rgba(0,0,0,.22); border-radius:999px; }
    .container{ width:min(430px, 100%); margin:0 auto; }

    /* ===== PIN ===== */
    .lock{ display:grid; place-items:center; overflow:auto; }
    .lockWrap{
      width:min(420px, 92vw);
      height:min(860px, 92vh);
      padding:52px 22px 28px;
      display:flex; flex-direction:column; align-items:center;
      position:relative;
    }
    .lock h1{
      margin:18px 0 16px;
      font-size:44px; line-height:1.05;
      font-weight:500;
      letter-spacing:-0.25px;
      text-align:center;
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
    }
    .dots{ display:flex; gap:14px; margin:10px 0 26px; }
    .dot{
      width:12px; height:12px; border-radius:999px;
      background: rgba(255,255,255,.55);
      box-shadow: 0 2px 10px rgba(0,0,0,.08) inset;
      transition: transform .18s ease, background-color .18s ease;
    }
    .dot.filled{ background: rgba(255,255,255,.92); transform: scale(1.08); }

    .pad{
      width:100%; max-width:340px;
      display:grid; grid-template-columns: repeat(3, 1fr);
      gap:18px 20px;
      margin-top:10px;
    }
    .key{
      position:relative;
      height:92px;
      border:none;
      border-radius:999px;
      background: rgba(255,255,255,.70);
      box-shadow: var(--softShadow);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      overflow:hidden;
      display:grid; place-items:center;
      font-size:44px; line-height:1;
      font-weight:500;
      letter-spacing:-0.2px;
      color: rgba(0,0,0,.88);
      transition: transform .12s ease, background-color .12s ease, box-shadow .12s ease;
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
    }
    .key::before{
      content:"";
      position:absolute; inset:0;
      border-radius:999px;
      border: 1.5px solid rgba(255,255,255,.72);
      pointer-events:none;
    }
    .key:active{ transform: scale(.94); background: rgba(255,255,255,.88); box-shadow: 0 10px 18px rgba(0,0,0,.10); }
    .key.icon{ font-size:0; }
    .key.icon svg{ width:40px; height:40px; stroke: rgba(0,0,0,.78); }

    .note{
      margin-top:auto;
      padding-top:20px;
      font-size:18px;
      font-weight:500;
      letter-spacing:-0.1px;
      color: rgba(0,0,0,.75);
      text-align:center;
    }

    /* ripple */
    .ripple{
      position:absolute;
      border-radius:999px;
      transform: translate(-50%,-50%);
      pointer-events:none;
      width:10px; height:10px;
      background: rgba(255,255,255,.55);
      animation: ripple .45s ease-out forwards;
      mix-blend-mode: soft-light;
    }
    @keyframes ripple{
      from { opacity:.9; transform: translate(-50%,-50%) scale(1); }
      to   { opacity:0;  transform: translate(-50%,-50%) scale(18); }
    }

    /* ===================== DOCS BG ===================== */
    .docsBg{
      background:
        radial-gradient(520px 420px at 16% 74%, rgba(255,170,200,.55), transparent 62%),
        radial-gradient(520px 420px at 82% 74%, rgba(255,220,120,.55), transparent 62%),
        radial-gradient(560px 480px at 75% 18%, rgba(150,210,255,.60), transparent 62%),
        radial-gradient(560px 480px at 20% 10%, rgba(130,220,200,.52), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
    }

    /* ===== DOCS layout: НЕ на весь экран, видно соседние ===== */
    .carousel{
      margin-top: 34px;
      display:flex;
      gap: 18px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      padding: 0 26px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel::-webkit-scrollbar{ height:0; }

    .docCard{
      scroll-snap-align:center;
      flex: 0 0 86%;
      max-width: 392px;
      height: 675px;
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,.42);
      box-shadow: 0 26px 58px rgba(0,0,0,.18);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(10px);
      background:
        radial-gradient(560px 520px at 18% 78%, rgba(255,170,200,.34), transparent 62%),
        radial-gradient(560px 520px at 86% 78%, rgba(255,220,120,.40), transparent 62%),
        radial-gradient(620px 520px at 78% 18%, rgba(150,210,255,.46), transparent 62%),
        radial-gradient(620px 520px at 22% 14%, rgba(130,220,200,.36), transparent 62%),
        rgba(255,255,255,.14);
    }

    /* ---- marquee обновлено ---- */
    .docMarqueeBar{
      position:absolute; left:0; right:0;
      bottom: 128px;
      height: 54px;
      background: var(--marqueeBg);
      box-shadow: inset 0 1px 0 rgba(0,0,0,.06);
      overflow:hidden;
      display:flex; align-items:center;
    }
    .docMarqueeTrack{
      display:flex; gap:60px;
      white-space:nowrap;
      will-change: transform;
      animation: docMarquee 12s linear infinite;
      padding-left: 22px;
    }
    .docMarqueeText{
      font-family:"e-Ukraine";
      font-weight:700;
      font-size:22px;
      letter-spacing:-0.12px;
      color:#0b0f14;
    }
    @keyframes docMarquee{
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ---- bottom block ---- */
    .docBottomBlock{
      position:absolute; left:0; right:0; bottom:0;
      height: 128px;
      display:flex; align-items:flex-end; justify-content:space-between;
      padding: 18px 20px 20px;
      background: rgba(255,255,255,.02);
    }
    .docBottomTitle{
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
      font-weight:700;
      font-size:52px;
      letter-spacing:-0.75px;
      line-height:0.92;
      color:#000;
    }
    .docBottomRight{
      display:flex;
      align-items:center;
      gap:14px;
      padding-bottom: 8px;
    }
    .iconCopy{
      width:30px; height:30px;
      stroke: rgba(0,0,0,.86);
      fill:none;
      stroke-width:2.2;
    }
    .dotMenu{
      width:48px; height:48px;
      border-radius:999px;
      background: rgba(0,0,0,.92);
      display:grid; place-items:center;
      box-shadow: 0 16px 26px rgba(0,0,0,.18);
    }
    .dotMenu span{
      width:6px; height:6px;
      border-radius:999px;
      background:#fff;
      box-shadow: 10px 0 0 #fff, -10px 0 0 #fff;
      display:block;
    }

    /* верхние “…” у первой карточки */
    .topDots{
      position:absolute;
      right: 26px;
      top: 110px;
      display:flex;
      flex-direction:column;
      gap:10px;
      opacity:.55;
    }
    .topDots .dRow{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .topDots i{
      width:6px; height:6px;
      border-radius:999px;
      background: rgba(0,0,0,.45);
      display:block;
    }

    /* ---- Card 1 Tax ---- */
    .taxPad{ padding: 30px 30px 0; }
    .taxTitle{
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
      font-weight:700;
      letter-spacing:-0.6px;
      font-size:46px;
      line-height:1.02;
      margin: 6px 0 22px;
      color:#000;
    }
    .taxBlock{
      font-family:"e-Ukraine";
      font-weight:700;
      font-size:30px;
      letter-spacing:-0.35px;
      margin: 0 0 18px;
      color:#000;
    }
    .taxName{
      font-family:"e-Ukraine";
      font-weight:700;
      font-size:30px;
      letter-spacing:-0.35px;
      margin: 0 0 26px;
      color:#000;
    }
    .taxLabel{
      font-family:"e-Ukraine";
      font-weight:500;
      font-size:22px;
      letter-spacing:-0.18px;
      color: rgba(0,0,0,.86);
      line-height:1.18;
    }

    /* ---- Card 2 Passport ---- */
    .passPad{ padding: 30px 30px 0; }
    .passTitle{
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
      font-weight:700;
      letter-spacing:-0.6px;
      font-size:44px;
      line-height:1.02;
      margin: 6px 0 22px;
      color:#000;
    }
    .passRow{
      display:flex;
      gap:22px;
      align-items:flex-start;
      margin-top: 6px;
    }
    .passLogo{
      width: 220px;
      height: 250px;
      border-radius: 30px;
      background: radial-gradient(260px 180px at 45% 20%, rgba(255,255,255,.10), transparent 60%),
                  linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.86));
      box-shadow: 0 18px 34px rgba(0,0,0,.22);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .passLogo::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(260px 240px at 52% 18%, rgba(255,255,255,.10), transparent 60%);
      opacity:.85;
      pointer-events:none;
    }
    .passLogo span{
      font-family:"e-Ukraine Head","e-Ukraine",system-ui,sans-serif;
      font-size:66px;
      font-weight:700;
      letter-spacing:-0.6px;
      color:#fff;
      opacity:.88;
      z-index:1;
    }
    .passInfo{
      font-family:"e-Ukraine";
      font-weight:500;
      margin-top: 8px;
      font-size:24px;
      letter-spacing:-0.2px;
      color:#000;
      line-height:1.2;
    }
    .passInfo .muted{ display:block; margin-top: 14px; font-weight:500; }
    .signature{ margin-top: 24px; width: 190px; height: 70px; opacity:.92; }

    /* pager dots */
    .pager{
      margin-top: 18px;
      display:flex;
      justify-content:center;
      gap:12px;
      opacity:.95;
    }
    .pDot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.55);
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
      transition: transform .15s ease, background .15s ease;
    }
    .pDot.active{ background: rgba(255,255,255,.92); transform: scale(1.1); }

    @media (max-height: 720px){
      .docCard{ height: 640px; border-radius: 32px; }
      .docMarqueeBar{ bottom: 120px; height: 52px; }
      .docBottomTitle{ font-size:46px; }
      .taxTitle{ font-size:42px; }
      .passTitle{ font-size:40px; }
      .passLogo{ width: 205px; height: 235px; }
    }
  </style>
</head>

<body class="locked">
  <div class="app">

    <!-- ===== PIN ===== -->
    <section class="view lock" id="viewLock" aria-label="PIN view">
      <div class="lockWrap">
        <h1>Код для входу</h1>

        <div class="dots" id="dots" aria-label="dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="pad" aria-label="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>

          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>

          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>

          <button class="key icon" data-action="face" aria-label="Face ID (demo)">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H6a3 3 0 0 0-3 3v2"/>
              <path d="M16 3h2a3 3 0 0 1 3 3v2"/>
              <path d="M8 21H6a3 3 0 0 1-3-3v-2"/>
              <path d="M16 21h2a3 3 0 0 0 3-3v-2"/>
              <path d="M9 10h.01M15 10h.01"/>
              <path d="M8.5 15c1 1 2.2 1.5 3.5 1.5s2.5-.5 3.5-1.5"/>
              <path d="M12 12v.01"/>
            </svg>
          </button>

          <button class="key" data-key="0">0</button>

          <button class="key icon" data-action="del" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 7H10L4 12l6 5h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/>
              <path d="m14.5 10.5 4 4"/>
              <path d="m18.5 10.5-4 4"/>
            </svg>
          </button>
        </div>

        <div class="note">Не пам'ятаю код для входу</div>
      </div>
    </section>

    <!-- ===== DOCS ===== -->
    <section class="view page hidden docsBg" id="viewDocs" aria-label="Documents view">
      <div class="scroll" style="padding-left:0;padding-right:0;">
        <div style="width:100%;">
          <div class="carousel" id="docCarousel" aria-label="Документи карусель">

            <!-- 1) Картка платника податків -->
            <article class="docCard" aria-label="Картка платника податків">
              <div class="taxPad">
                <div class="taxTitle">Картка платника<br>податків</div>
                <div class="taxBlock">РНОКПП</div>
                <div class="taxName">Настройте<br>ФИО</div>
                <div class="taxLabel">Дата народження:<br>Настройте в боте</div>
              </div>

              <div class="topDots" aria-hidden="true">
                <div class="dRow"><i></i><i></i><i></i></div>
                <div class="dRow"><i></i><i></i><i></i></div>
              </div>

              <div class="docMarqueeBar" aria-label="Документ оновлено">
                <div class="docMarqueeTrack">
                  <div class="docMarqueeText js-updated-text"></div>
                  <div class="docMarqueeText js-updated-text"></div>
                </div>
              </div>

              <div class="docBottomBlock">
                <div class="docBottomTitle">Настройте<br>ИНН в боте</div>
                <div class="docBottomRight">
                  <svg class="iconCopy" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 9h11v11H9z"/>
                    <path d="M4 4h11v11"/>
                  </svg>
                  <div class="dotMenu" aria-hidden="true"><span></span></div>
                </div>
              </div>
            </article>

            <!-- 2) Паспорт громадянина України -->
            <article class="docCard" aria-label="Паспорт громадянина України">
              <div class="passPad">
                <div class="passTitle">Паспорт громадянина<br>України</div>

                <div class="passRow">
                  <div class="passLogo" aria-hidden="true"><span>Дія</span></div>
                  <div class="passInfo">
                    Дата<br>народження:<br>Настройте<br>в боте
                    <span class="muted">Номер:<br>1</span>

                    <svg class="signature" viewBox="0 0 260 100" aria-hidden="true">
                      <path d="M18 62c34-34 50-38 62-18 12 20-8 40-30 28-16-9-9-34 18-40 26-6 54 10 74 30 18 18 34 18 52-2 12-14 22-28 38-26 10 1 12 10-2 18-16 10-30 10-46 0"
                            fill="none" stroke="#0b0f14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
                    </svg>
                  </div>
                </div>
              </div>

              <div class="docMarqueeBar" aria-label="Документ оновлено">
                <div class="docMarqueeTrack">
                  <div class="docMarqueeText js-updated-text"></div>
                  <div class="docMarqueeText js-updated-text"></div>
                </div>
              </div>

              <div class="docBottomBlock">
                <div class="docBottomTitle">Настройте<br>ФИО</div>
                <div class="docBottomRight">
                  <div class="dotMenu" aria-hidden="true"><span></span></div>
                </div>
              </div>
            </article>

          </div>

          <div class="pager" id="docPager" aria-label="pager">
            <div class="pDot active"></div>
            <div class="pDot"></div>
            <div class="pDot"></div>
            <div class="pDot"></div>
            <div class="pDot"></div>
            <div class="pDot"></div>
            <div class="pDot"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- placeholders -->
    <section class="view page hidden" id="viewServices"><div class="scroll"><div class="container"><div style="font-size:38px;font-weight:700;font-family:'e-Ukraine Head','e-Ukraine',system-ui,sans-serif;">Сервіси</div></div></div></section>
    <section class="view page hidden" id="viewMenu"><div class="scroll"><div class="container"><div style="font-size:38px;font-weight:700;font-family:'e-Ukraine Head','e-Ukraine',system-ui,sans-serif;">Меню</div></div></div></section>

    <!-- bottom nav -->
    <nav class="bottomNav" aria-label="Bottom navigation">
      <div class="navRow">
        <a class="navItem" href="javascript:void(0)" data-nav="docs">
          <svg viewBox="0 0 24 24">
            <path d="M4 5h16v6H4z"/>
            <path d="M4 15h10v4H4z"/>
            <path d="M16 15h4v4h-4z"/>
          </svg>
          <div>Стрічка</div>
        </a>

        <a class="navItem active" href="javascript:void(0)" data-nav="docs">
          <svg viewBox="0 0 24 24">
            <path d="M7 3h8l4 4v14H7z"/>
            <path d="M15 3v4h4"/>
          </svg>
          <div>Документи</div>
        </a>

        <a class="navItem" href="javascript:void(0)" data-nav="services">
          <svg viewBox="0 0 24 24">
            <path d="M12 2l2.2 6.4L21 9l-5 3.9L17.8 20 12 16.5 6.2 20 8 12.9 3 9l6.8-.6z"/>
          </svg>
          <div>Сервіси</div>
        </a>

        <a class="navItem" href="javascript:void(0)" data-nav="menu">
          <svg viewBox="0 0 24 24">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
          <div>Меню</div>
        </a>
      </div>
    </nav>

  </div>

  <script>
    // ===== PIN -> enter app (accept any 4 digits) =====
    let entered = "";
    const dotEls = Array.from(document.querySelectorAll("#dots .dot"));
    const viewLock = document.getElementById("viewLock");

    const views = {
      docs: document.getElementById("viewDocs"),
      services: document.getElementById("viewServices"),
      menu: document.getElementById("viewMenu"),
    };

    const navItems = Array.from(document.querySelectorAll(".navItem"));

    function setDots(count){
      dotEls.forEach((d, i) => d.classList.toggle("filled", i < count));
    }

    function ripple(btn, clientX, clientY){
      const r = document.createElement("span");
      r.className = "ripple";
      const rect = btn.getBoundingClientRect();
      r.style.left = (clientX - rect.left) + "px";
      r.style.top  = (clientY - rect.top) + "px";
      btn.appendChild(r);
      r.addEventListener("animationend", () => r.remove());
    }

    function showView(name){
      Object.entries(views).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
      navItems.forEach(a => a.classList.toggle("active", a.dataset.nav === name));
    }

    function enterApp(){
      document.body.classList.remove("locked");
      viewLock.classList.add("hidden");
      showView("docs");
    }

    function handleDigit(d){
      if (entered.length >= 4) return;
      entered += d;
      setDots(entered.length);
      if (entered.length === 4) setTimeout(enterApp, 120);
    }

    function del(){
      if (!entered.length) return;
      entered = entered.slice(0, -1);
      setDots(entered.length);
    }

    document.querySelectorAll(".key").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => ripple(btn, e.clientX, e.clientY));
      btn.addEventListener("click", () => {
        const key = btn.dataset.key;
        const action = btn.dataset.action;
        if (key != null) handleDigit(key);
        else if (action === "del") del();
      });
    });

    window.addEventListener("keydown", (e) => {
      if (!document.body.classList.contains("locked")) return;
      if (e.key >= "0" && e.key <= "9") handleDigit(e.key);
      if (e.key === "Backspace") del();
    });

    navItems.forEach(a => {
      a.addEventListener("click", () => {
        if (document.body.classList.contains("locked")) return;
        const key = a.dataset.nav;
        if (key === "services") showView("services");
        else if (key === "menu") showView("menu");
        else showView("docs");
      });
    });

    // ===== Dynamic "updated" time (user local time) =====
    function pad2(n){ return String(n).padStart(2, "0"); }
    function makeUpdatedLine(){
      const d = new Date();
      const hh = pad2(d.getHours());
      const mm = pad2(d.getMinutes());
      const dd = pad2(d.getDate());
      const mo = pad2(d.getMonth()+1);
      const yy = d.getFullYear();
      return `Документ оновлено о ${hh}:${mm} | ${dd}.${mo}.${yy} • `;
    }
    function updateUpdatedText(){
      const base = makeUpdatedLine();
      const long = base + base + base + base;
      document.querySelectorAll(".js-updated-text").forEach(el => el.textContent = long);
    }
    updateUpdatedText();
    setInterval(updateUpdatedText, 1000);

    // ===== docs pager for carousel =====
    const carousel = document.getElementById("docCarousel");
    const pagerDots = Array.from(document.querySelectorAll("#docPager .pDot"));
    function updatePager(){
      const cards = Array.from(carousel.querySelectorAll(".docCard"));
      if (!cards.length) return;
      const center = carousel.scrollLeft + carousel.clientWidth / 2;

      let bestIdx = 0, bestDist = Infinity;
      cards.forEach((c, i) => {
        const cardCenter = c.offsetLeft + c.clientWidth / 2;
        const dist = Math.abs(cardCenter - center);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      });

      pagerDots.forEach((d, i) => d.classList.toggle("active", i === bestIdx));
    }
    carousel?.addEventListener("scroll", () => requestAnimationFrame(updatePager), { passive:true });
    updatePager();
  </script>
</body>
</html>
